<!DOCTYPE html>
<html lang="ru">
<head>

<link rel="icon" href="data:image/svg%2Bxml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='38' fill='%230b0d10'/%3E%3Crect x='34' y='118' width='26' height='40' fill='%233ecf8e'/%3E%3Crect x='70' y='92' width='26' height='66' fill='%233ecf8e'/%3E%3Crect x='106' y='60' width='26' height='98' fill='%23e0a84c'/%3E%3Crect x='142' y='34' width='16' height='124' fill='%23ef5b5b'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D0%9F%D1%80%D0%BE%D0%B3%D1%80%D0%B5%D1%81%D1%81%D0%B8%D1%8F%20%D0%BE%D0%B1%D1%8A%D1%91%D0%BC%D0%B0%22%2C%22short_name%22%3A%22%D0%9B%D0%B5%D1%81%D1%82%D0%BD%D0%B8%D1%86%D0%B0%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0d10%22%2C%22theme_color%22%3A%22%230b0d10%22%7D">
<style>

  :root{
    --bg: #0b0d10;
    --panel: #14171b;
    --panel2: #1a1e23;
    --line: #262b31;
    --text: #e8eaed;
    --dim: #7b838d;
    --buy: #3ecf8e;
    --buy-dim: #1c3a2c;
    --sell: #ef5b5b;
    --sell-dim: #3a1e1e;
    --amber: #e0a84c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ max-width:100%; overflow-x:hidden; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    padding: 16px 12px 40px;
    min-height:100vh;
    max-width:100%; overflow-x:hidden;
  }
  h1{
    font-size:15px; font-weight:600; letter-spacing:0.02em;
    color:var(--dim); text-transform:uppercase; margin:0 0 14px;
  }
  .capital-row{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:10px;
  }
  .capital-row label{ font-size:11.5px; color:var(--dim); line-height:1.25; flex:0 1 auto; min-width:0; }
  .capital-row input{
    flex:1 1 0; width:0; min-width:0;
    background:transparent; border:none; color:var(--text);
    font-family:inherit; font-size:19px; font-weight:600; text-align:right;
    outline:none;
  }
  .capital-row .pfx{color:var(--dim); font-size:15px; flex:0 0 auto;}
  .presets{ display:flex; gap:8px; margin-bottom:14px; }
  .presets button{
    flex:1 1 0; min-width:0; background:var(--panel2); border:1px solid var(--line); color:var(--dim);
    font-family:inherit; font-size:11.5px; padding:7px 2px; border-radius:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .presets{ flex-wrap:wrap; }
  .presets button.active{ color:var(--text); border-color:var(--amber); }

  .cfg{
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; margin-bottom:16px;
  }
  .cfg .cap{ font-size:10.5px; color:var(--dim); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:5px; }
  .cfg .opts{ display:flex; gap:6px; }
  .cfg .opts button{
    flex:1 1 0; min-width:0; background:var(--panel2); border:1px solid var(--line); color:var(--dim);
    font-family:inherit; font-size:12px; padding:6px 2px; border-radius:6px;
  }
  .cfg .opts button.active{ color:var(--text); border-color:var(--amber); }

  .side{
    border-radius:14px; padding:16px; margin-bottom:14px;
    border:1px solid var(--line);
  }
  .side.buy{ background:linear-gradient(180deg, var(--buy-dim), var(--panel) 70%); }
  .side.sell{ background:linear-gradient(180deg, var(--sell-dim), var(--panel) 70%); }

  .side-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .side-head .dir{ font-size:14px; font-weight:700; letter-spacing:0.06em; }
  .side.buy .dir{ color:var(--buy); }
  .side.sell .dir{ color:var(--sell); }
  .side-head .stage{ font-size:12px; color:var(--dim); text-align:right; }

  .side{ overflow:hidden; }
  .big{ font-size:32px; font-weight:700; line-height:1.1; margin-bottom:4px; word-break:break-word; }
  .big .unit{ font-size:15px; color:var(--dim); font-weight:500; margin-left:6px;}
  .sub{ font-size:12px; color:var(--dim); display:flex; gap:6px 14px; margin-bottom:8px; flex-wrap:wrap;}
  .sub > span{ min-width:0; }
  .sub b{ color:var(--text); font-weight:600; }
  .sub b.neg{ color:var(--sell); }
  .sub b.pos{ color:var(--buy); }
  .sub b.amb{ color:var(--amber); }

  .bar{
    height:4px; border-radius:2px; background:var(--panel2);
    overflow:hidden; margin-bottom:12px; border:1px solid var(--line);
  }
  .bar i{ display:block; height:100%; background:var(--amber); }

  .btn-row{ display:flex; gap:8px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:13px 0;
    font-family:inherit; font-size:13px; font-weight:700; letter-spacing:0.03em;
  }
  .side.buy .btn.stop{ background:var(--buy); color:#08130d; }
  .side.sell .btn.stop{ background:var(--sell); color:#1a0808; }
  .btn.reset{ background:var(--panel2); color:var(--dim); border:1px solid var(--line); }
  .btn:active{ opacity:0.75; }
  .btn:disabled{ opacity:0.3; }

  .table-toggle{
    width:100%; background:none; border:none; color:var(--dim);
    font-family:inherit; font-size:12px; padding:10px 0; text-align:center;
    border-top:1px solid var(--line); margin-top:6px;
  }
  #tableWrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:11px; margin-top:8px;}
  th{ color:var(--dim); font-weight:600; text-align:right; padding:6px 2px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th:first-child, td:first-child{ text-align:left; }
  td{ text-align:right; padding:6px 2px; border-bottom:1px solid #1c2025; white-space:nowrap; }
  td.neg{ color:var(--sell); }
  td.pos{ color:var(--buy); }
  tr.cur td{ background:#1e1a12; }
  tr.cur td:first-child{ color:var(--amber); font-weight:700; }

  .depth{
    overflow:hidden;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px; margin-top:16px;
  }
  .depth h2{
    font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--dim); margin:0 0 4px;
  }
  .depth p{ font-size:11px; color:var(--dim); margin:0 0 10px; line-height:1.5; }
  .depth table{ margin-top:0; }
  .depth td.now{ color:var(--amber); }

  .calc{
    overflow:hidden;
    background:var(--panel); border:1px solid var(--amber);
    border-radius:12px; padding:14px; margin-top:16px;
  }
  .calc h2{
    font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--amber); margin:0 0 8px;
  }
  .calc .in{
    display:flex; align-items:center; gap:10px;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; margin-bottom:12px;
  }
  .calc .in label{ font-size:11.5px; color:var(--dim); line-height:1.25; flex:0 1 auto; min-width:0; }
  .calc .in input{
    flex:1 1 0; width:0; min-width:0;
    background:transparent; border:none; color:var(--text);
    font-family:inherit; font-size:19px; font-weight:600; text-align:right; outline:none;
  }
  .calc .in .pfx{ color:var(--dim); font-size:15px; flex:0 0 auto; }
  .lossbtns{ display:flex; gap:8px; margin:-4px 0 12px; }
  .lossbtns button{
    flex:1 1 0; min-width:0; background:var(--panel2); border:1px solid var(--line);
    color:var(--amber); font-family:inherit; font-size:12px; font-weight:600;
    padding:9px 0; border-radius:8px;
  }
  .lossbtns button:active{ opacity:0.7; }
  .calc .out{ font-size:13px; color:var(--dim); line-height:1.7; }
  .calc .out .lot{ font-size:28px; font-weight:700; color:var(--text); line-height:1.15; }
  .calc .out .lot .unit{ font-size:14px; color:var(--dim); font-weight:500; margin-left:6px; }
  .calc .out b{ color:var(--text); font-weight:600; }
  .calc .out b.amb{ color:var(--amber); }
  .calc .out b.neg{ color:var(--sell); }
  .calc .warn{ color:var(--sell); font-weight:600; }
  .calc.buy{ border-color:var(--buy); }
  .calc.sell{ border-color:var(--sell); }
  .calc.buy h2{ color:var(--buy); }
  .calc.sell h2{ color:var(--sell); }
  .calc.buy .lossbtns button{ color:var(--buy); }
  .calc.sell .lossbtns button{ color:var(--sell); }
  .calc .lossbtns button.clr{ color:var(--dim); flex:0 0 90px; }
  .calcs{ display:flex; flex-direction:column; gap:12px; }
  .calc-head{ font-size:10.5px; color:var(--dim); letter-spacing:0.04em;
    text-transform:uppercase; margin:18px 0 -4px; }
  .hint{ font-size:11px; color:var(--dim); margin-top:14px; line-height:1.55; }
  .hint b{ color:var(--amber); font-weight:600; }
</style>
</head>
<body>

<h1>Прогрессия объёма</h1>

<div class="capital-row">
  <label>Капитал</label>
  <span class="pfx">$</span>
  <input type="number" id="capitalInput" value="500" inputmode="decimal">
</div>
<div class="capital-row">
  <label>Базовый<br>объём</label>
  <span class="pfx">BTC</span>
  <input type="number" id="lotInput" value="0.0545" inputmode="decimal" step="0.001">
</div>

<div class="presets">
  <button data-cap="500">$500</button>
  <button data-cap="1000">$1k</button>
  <button data-cap="2000">$2k</button>
  <button data-cap="5000">$5k</button>
</div>

<div class="capital-row">
  <label>Цена BTC</label>
  <span class="pfx">$</span>
  <input type="number" id="priceInput" value="65000" inputmode="decimal">
</div>

<div class="capital-row">
  <label>Ход до стопа<br>$/BTC</label>
  <span class="pfx">$</span>
  <input type="number" id="distInput" value="120" inputmode="decimal">
</div>
<div class="presets" id="tfOpts">
  <button data-tf="1m" data-dist="120">1m · 120</button>
  <button data-tf="15m" data-dist="500">15m · 500</button>
</div>

<div class="cfg">
  <div class="cap">TP = стоп ×</div>
  <div class="opts" id="rrOpts">
    <button data-rr="2">2</button>
    <button data-rr="3">3</button>
    <button data-rr="4">4</button>
    <button data-rr="5">5</button>
  </div>
</div>

<div class="side buy" id="buyPanel"></div>
<div class="side sell" id="sellPanel"></div>

<button class="table-toggle" id="tableToggle">Показать таблицу ▾</button>
<div id="tableWrap" style="display:none;"></div>

<div class="calc-head">Следующий вход от факта — раздельно по направлениям</div>
<div class="calcs">

  <div class="calc buy">
    <h2>BUY · long</h2>
    <div class="in">
      <label>Все стопы<br>серии в лонг</label>
      <span class="pfx">−$</span>
      <input type="text" id="lossBuy" placeholder="8+5+7" inputmode="text">
    </div>
    <div class="lossbtns">
      <button data-loss="add" data-dir="Buy">+ стоп</button>
      <button data-loss="clr" data-dir="Buy" class="clr">сброс</button>
    </div>
    <div class="out" id="outBuy"></div>
  </div>

  <div class="calc sell">
    <h2>SELL · short</h2>
    <div class="in">
      <label>Все стопы<br>серии в шорт</label>
      <span class="pfx">−$</span>
      <input type="text" id="lossSell" placeholder="8+5+7" inputmode="text">
    </div>
    <div class="lossbtns">
      <button data-loss="add" data-dir="Sell">+ стоп</button>
      <button data-loss="clr" data-dir="Sell" class="clr">сброс</button>
    </div>
    <div class="out" id="outSell"></div>
  </div>

</div>

<div class="hint" id="bothWarn"></div>

<div class="depth" id="depthBox"></div>

<div class="hint" id="hintBox"></div>

<script>
/* ── КОНСТАНТЫ ────────────────────────────────────────────────
   Базовая конструкция: 10 ступеней, лестница съедает ровно депозит.
   STEP — шаг прогрессии, подобран так, что сумма 10 множителей = 40.
   Стоп-1 = капитал / 40  →  $500 даёт стоп $12.50 = 0.025 BTC.
   STEP зафиксирован НАВСЕГДА: именно он задаёт асимптоту требуемого R
   (1/(STEP−1) ≈ 3.48) — то есть любой TP от ×3.5 отыгрывает серию
   на ЛЮБОЙ глубине. Растягивать лестницу глубже 10 можно только
   деньгами при том же шаге — см. блок «Запас глубины».           */
const BASE_STAGES = 10;
const SUM_MULT    = 40;
const STEP        = 1.287216;      // (STEP^10 − 1)/(STEP − 1) = 40
const ASYMPTOTE_R = 1/(STEP-1);    // ≈ 3.48
const MIN_LOT     = 0.001;

/* ── ТАЙМФРЕЙМЫ ───────────────────────────────────────────────
   Единственное, что меняет ТФ, — стоп-дистанция в долларах на монету.
   Вся лестница (10 ступеней, шаг, сумма 40, асимптота ×3.48) не трогается:
   ряд объёмов в BTC на обоих ТФ ОДИН И ТОТ ЖЕ, разная только цена стопа.
     15m: $500 на BTC  →  0.025 BTC = $12.50 стопа  (эталон)
      1m: $120 на BTC  →  0.025 BTC = $3.00 стопа                        */
const TF = {
  '15m': { stopPerBTC: 500 },
  '1m' : { stopPerBTC: 120 }
};
/* Ход до стопа РЕДАКТИРУЕТСЯ: он ставится по структуре и от сделки к сделке
   гуляет (замеры Максима: 0.03 BTC → $3.5 это $117/монету, 0.05 BTC → $8
   это $160/монету — полтора раза разницы на одном ТФ). Кнопки 1m/15m —
   только пресеты, не константы.                                          */
/* ── КОМИССИЯ ВНУТРИ СТОПА ────────────────────────────────────
   Комиссия считается от notional и от ТФ не зависит: round trip =
   2 × ставка × цена, в долларах НА МОНЕТУ. Складывается со стоп-
   дистанцией → эффективная цена стопа. Все цифры в проге ЧИСТЫЕ.
     1m  тейкер при $65k: $120 + $65 = $185 на монету
     15m тейкер при $65k: $500 + $65 = $565 на монету               */
const FEE_AVG = 0.00035;   // усреднённая ставка за ОДНУ сторону (между 0.02% и 0.05%)
function stopPerBTC(){ return parseFloat(state.dist) || 0; }
function feePerBTC(){ return (parseFloat(state.price)||0) * 2 * FEE_AVG; }
function effDist(){ return stopPerBTC() + feePerBTC(); }
function refCapital(){ return SUM_MULT * 0.025 * effDist(); }
/* Базовый объём и капитал — две записи одного и того же:
   капитал = 40 × базовый объём × (ход + комиссия).
   Меняешь одно — второе пересчитывается.                    */
function baseLot(){
  const de = effDist();
  return de ? (parseFloat(state.capital)||0) / (SUM_MULT * de) : 0;
}
function capitalFromLot(lot){ return SUM_MULT * lot * effDist(); }
function asymptoteR(){
  const d = stopPerBTC(), c = feePerBTC();
  return (ASYMPTOTE_R * (d + c) + c) / d;
}

function sumMult(n){ return (Math.pow(STEP,n) - 1) / (STEP - 1); }

function computeLevels(capital, rr){
  const stop1 = capital / SUM_MULT;      // стоп-1 УЖЕ чистый, с комиссией
  const d  = stopPerBTC();               // ход цены до стопа, $/монету
  const c  = feePerBTC();                // комиссия round trip, $/монету
  const de = d + c;                      // эффективная цена стопа
  const levels = [];
  let cum = 0;
  for(let n=1;n<=BASE_STAGES;n++){
    const stopDollars = stop1 * Math.pow(STEP, n-1);   // чистый убыток ступени
    const lot = de ? stopDollars / de : 0;
    levels.push({
      n,
      btc: lot,
      stopDollars,                                     // чистыми
      fee: lot * c,                                    // из них комиссия
      grossStop: lot * d,                              // ход цены без комиссии
      netIfWin: lot*(rr*d - c) - cum,                  // тейк ×rr чистыми
      breakevenR: lot ? (cum/lot + c)/d : 0,           // нужный R по ходу цены
      cumIfLost: cum + stopDollars
    });
    cum += stopDollars;
  }
  return levels;
}

let state = { capital: 165, price: 65000, tf: '1m', dist: 120, lossBuy: '', lossSell: '', rr: 3, buyStage: 1, sellStage: 1 };

function loadState(){
  try{
    const raw = localStorage.getItem('position-sizer-state-v12')
             || localStorage.getItem('position-sizer-state-v11');
    if(raw){
      const saved = JSON.parse(raw);
      // миграция с v11: единое поле убытков переезжает в лонговое
      if(saved.lossInput !== undefined && saved.lossBuy === undefined){
        saved.lossBuy = saved.lossInput; saved.lossSell = '';
      }
      delete saved.lossInput;
      state = Object.assign(state, saved);
    }
  }catch(e){}
  render();
}
function saveState(){
  try{ localStorage.setItem('position-sizer-state-v12', JSON.stringify(state)); }catch(e){}
}

function fmtBTC(x){ return x.toFixed(x < 0.01 ? 5 : 4); }
function fmtUSD(x){ return Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtUSD0(x){ return Math.round(x).toLocaleString('en-US'); }

function renderSide(id, dirLabel, stage, cls){
  const capital = parseFloat(state.capital)||0;
  const levels  = computeLevels(capital, state.rr);
  const cur     = levels[Math.min(stage, BASE_STAGES) - 1];
  const isMax   = stage >= BASE_STAGES;
  const netPos  = cur.netIfWin >= 0;
  const smallLot = cur.btc < MIN_LOT;

  const netCell = netPos
    ? `<span>при TP ×${state.rr} <b class="pos">+$${fmtUSD(cur.netIfWin)}</b> чистыми</span>`
    : `<span>при TP ×${state.rr} серия не закрывается: <b class="neg">−$${fmtUSD(cur.netIfWin)}</b></span>`;

  const beCell = stage === 1 ? '' :
    `<span>в ноль по серии от <b class="amb">×${cur.breakevenR.toFixed(2)}</b> стопа</span>`;

  document.getElementById(id).innerHTML = `
    <div class="side-head">
      <span class="dir">${dirLabel}</span>
      <span class="stage">${stage===1 ? 'первый вход' : 'вход №'+stage+' · после '+(stage-1)+' стоп'+((stage-1)===1?'а':'ов')}</span>
    </div>
    <div class="big">${fmtBTC(cur.btc)}<span class="unit">BTC</span></div>
    <div class="sub">
      <span>стоп <b class="neg">−$${fmtUSD(cur.stopDollars)}</b> чистыми <b style="color:var(--dim)">(ход −$${fmtUSD(cur.grossStop)} + комис. $${fmtUSD(cur.fee)})</b></span>
      ${beCell}
      ${netCell}
      <span>накоплено <b class="neg">−$${fmtUSD(cur.cumIfLost)}</b> из $${fmtUSD(capital)}</span>
      ${smallLot ? `<span><b class="neg">объём ниже минимального лота ${MIN_LOT}</b></span>` : ''}
    </div>
    <div class="bar"><i style="width:${Math.min(100, capital ? cur.cumIfLost/capital*100 : 0).toFixed(1)}%"></i></div>
    <div class="btn-row">
      <button class="btn stop" data-action="stop" data-side="${cls}" ${isMax?'disabled':''}>Стоп ${isMax?'(предел)':'→ вход '+(stage+1)}</button>
      <button class="btn reset" data-action="reset" data-side="${cls}">Прибыль / Сброс</button>
    </div>
  `;
}

function renderTable(){
  const capital = parseFloat(state.capital)||0;
  const levels = computeLevels(capital, state.rr);
  const rows = levels.map(l => `
    <tr class="${(l.n===state.buyStage||l.n===state.sellStage)?'cur':''}">
      <td>${l.n}</td>
      <td>${fmtBTC(l.btc)}</td>
      <td>−${fmtUSD(l.stopDollars)}</td>
      <td>${fmtUSD(l.fee)}</td>
      <td>−${fmtUSD(l.cumIfLost)}</td>
      <td>${l.n===1?'—':'×'+l.breakevenR.toFixed(2)}</td>
      <td class="${l.netIfWin>=0?'pos':'neg'}">${l.netIfWin>=0?'+':'−'}${fmtUSD(l.netIfWin)}</td>
    </tr>`).join('');
  document.getElementById('tableWrap').innerHTML = `
    <table>
      <tr><th>№</th><th>BTC</th><th>стоп</th><th>комис.</th><th>накопл.</th><th>в ноль</th><th>×${state.rr}</th></tr>
      ${rows}
    </table>`;
}

function renderDepth(){
  const capital = parseFloat(state.capital)||0;
  const stop1 = capital / SUM_MULT;              // стоп-1 держим неизменным
  const rows = [];
  for(let n=BASE_STAGES; n<=15; n++){
    const need = stop1 * sumMult(n);
    const cur  = n===BASE_STAGES;
    rows.push(`
      <tr>
        <td class="${cur?'now':''}">${n} ступеней</td>
        <td class="${cur?'now':''}">$${fmtUSD0(need)}</td>
        <td>${cur ? 'сейчас' : '+$'+fmtUSD0(need-capital)}</td>
      </tr>`);
  }
  document.getElementById('depthBox').innerHTML = `
    <h2>Запас глубины</h2>
    <p>Ход до стопа $${fmtUSD0(stopPerBTC())} + комиссия $${fmtUSD0(feePerBTC())} =
       <b style="color:var(--amber)">$${fmtUSD0(effDist())}</b> на монету.
       Шаг прогрессии ×${STEP.toFixed(4)} и первый вход ${fmtBTC(effDist()?stop1/effDist():0)} BTC остаются теми же.
       Глубже 10 ступеней лестница растягивается только деньгами — вот сколько нужно на счёте:</p>
    <table>${rows.join('')}</table>`;
}

/* Следующий вход от ФАКТИЧЕСКОГО убытка.
   Из геометрии лестницы: stop_{n+1} = stop1 + (STEP−1)×накопленный убыток.
   Работает при любом введённом убытке, даже если он не совпал с расчётным
   (проскальзывание, ручное закрытие, другой объём) — считает от факта.   */
/* Поле принимает как одно число, так и сумму: "8+5+7" = 20.
   Так не надо складывать стопы в уме — просто дописываешь очередной. */
function parseLoss(str){
  if(str === undefined || str === null) return NaN;
  const parts = String(str).replace(/[^0-9.,+\s]/g,'').split('+');
  let total = 0, seen = false;
  for(const p of parts){
    const v = parseFloat(p.replace(',','.').trim());
    if(!isNaN(v)){ total += v; seen = true; }
  }
  return seen ? total : NaN;
}

function renderCalc(dir){
  const capital = parseFloat(state.capital)||0;
  const loss    = parseLoss(dir==='Buy' ? state.lossBuy : state.lossSell);
  const stop1   = capital / SUM_MULT;
  const de      = effDist();
  const out     = document.getElementById('out'+dir);
  const word    = dir==='Buy' ? 'лонг' : 'шорт';

  if(!(loss > 0)){
    out.innerHTML = `Серия в ${word} чистая. Первый вход <b>${fmtBTC(de?stop1/de:0)} BTC</b>
      (чистый стоп −$${fmtUSD(stop1)}).<br>
      Забрал стоп — вбей его сюда; список через плюс (<b>8+5+7</b>), складывать в уме не надо.`;
    return;
  }

  const nextStop = stop1 + (STEP - 1) * loss;      // чистый стоп следующего входа
  const lot      = de ? nextStop / de : 0;
  const stage    = Math.log(1 + loss*(STEP-1)/stop1) / Math.log(STEP) + 1;
  const left     = capital - loss;
  const over     = loss >= capital;
  const smallLot = lot < MIN_LOT;

  out.innerHTML = `
    <div style="font-size:11.5px; margin-bottom:2px;">убыток серии в ${word} <b class="neg">−$${fmtUSD(loss)}</b></div>
    <div class="lot">${fmtBTC(lot)}<span class="unit">BTC</span></div>
    <div>база <b>${fmtBTC(baseLot())}</b> + накидка <b class="amb">${fmtBTC(lot-baseLot())}</b></div>
    <div>чистый стоп этого входа <b class="neg">−$${fmtUSD(nextStop)}</b>
      · из них комиссия $${fmtUSD(lot*feePerBTC())}</div>
    <div>по лестнице это вход <b class="amb">№${stage.toFixed(1)}</b>
      · в ноль по серии от <b class="amb">×${(( (loss/lot) + feePerBTC())/stopPerBTC()).toFixed(2)}</b> стопа</div>
    <div>останется депозита <b>${over?'—':'$'+fmtUSD(left)}</b> из $${fmtUSD(capital)}
      ${over ? '<span class="warn">· убыток перекрыл депозит</span>' : ''}</div>
    ${loss + nextStop > capital && !over ? `<div class="warn">этот стоп выйдет за депозит: −$${fmtUSD(loss+nextStop)} из $${fmtUSD(capital)}</div>` : ''}
    ${smallLot ? `<div class="warn">объём ниже минимального лота ${MIN_LOT}</div>` : ''}
  `;
}

function renderCalcs(){
  renderCalc('Buy'); renderCalc('Sell');
  const both = parseLoss(state.lossBuy) + parseLoss(state.lossSell);
  const cap  = parseFloat(state.capital)||0;
  const box  = document.getElementById('bothWarn');
  if(!box) return;
  box.innerHTML = (both > 0 && parseLoss(state.lossBuy) > 0 && parseLoss(state.lossSell) > 0)
    ? `<span class="${both >= cap ? 'warn' : ''}">Две серии открыты одновременно: суммарно
        −$${fmtUSD(both)} из $${fmtUSD(cap)} депозита. Лестница считает каждое направление
        от ПОЛНОГО капитала, поэтому при работе в обе стороны сразу запас глубины
        меньше расчётного.</span>`
    : '';
}

function renderHint(){
  const capital = parseFloat(state.capital)||0;
  const levels = computeLevels(capital, state.rr);
  const last = levels[levels.length-1];
  const flip = levels.find(l => l.netIfWin < 0);
  document.getElementById('hintBox').innerHTML = `
    Шаг ×${STEP.toFixed(4)}, сумма лестницы = ${SUM_MULT} стопов — 10-й стоп закрывает депозит ровно в ноль
    (−$${fmtUSD(last.cumIfLost)} из $${fmtUSD(capital)}).
    <b>Все суммы в проге — чистые, комиссия уже внутри.</b> Ход до стопа
    $${fmtUSD0(stopPerBTC())} + round trip $${fmtUSD0(feePerBTC())} = <b>$${fmtUSD0(effDist())}</b> на монету, поэтому
    первый вход 0.025 BTC стоит <b>$${fmtUSD(0.025*effDist())}</b>, а полная лестница от него = <b>$${fmtUSD0(refCapital())}</b>.
    Ряд объёмов в BTC на обоих ТФ одинаковый — меняется только цена стопа.<br><br>
    <b>Главная колонка — «в ноль»</b>, а не «×${state.rr}»: тейк берётся по концу волны и плавает, фиксированный множитель
    здесь только справочный. Требуемый R считается по ходу цены и с глубиной не растёт бесконечно — он упирается
    в <b>×${asymptoteR().toFixed(2)}</b> (без комиссии было бы ×${ASYMPTOTE_R.toFixed(2)}).
    Любой тейк выше этого порога закрывает серию в плюс на любой ступени.
    ${flip ? `При жёстком TP ×${state.rr} ступени с ${flip.n}-й в ноль не выходят.` : `TP ×${state.rr} перекрывает всю лестницу.`}<br><br>
    Состояние сохраняется на этом устройстве.
  `;
}

function render(){
  document.getElementById('capitalInput').value = state.capital;
  document.querySelectorAll('.presets button').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.cap)===parseFloat(state.capital));
  });
  document.getElementById('priceInput').value = state.price;
  document.getElementById('lotInput').value = baseLot().toFixed(4);
  document.getElementById('distInput').value = state.dist;
  document.getElementById('lossBuy').value  = state.lossBuy;
  document.getElementById('lossSell').value = state.lossSell;
  document.querySelectorAll('#tfOpts button').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.dist)===parseFloat(state.dist));
  });
  document.querySelectorAll('#rrOpts button').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.rr)===parseFloat(state.rr));
  });
  state.buyStage  = Math.min(state.buyStage,  BASE_STAGES);
  state.sellStage = Math.min(state.sellStage, BASE_STAGES);
  renderSide('buyPanel','BUY',state.buyStage,'buy');
  renderSide('sellPanel','SELL',state.sellStage,'sell');
  renderTable();
  renderCalcs();
  renderDepth();
  renderHint();
}

document.getElementById('capitalInput').addEventListener('input', e=>{
  state.capital = e.target.value; render(); saveState();
});
document.querySelectorAll('.presets button').forEach(b=>{
  b.addEventListener('click', ()=>{ state.capital = b.dataset.cap; render(); saveState(); });
});
document.getElementById('priceInput').addEventListener('input', e=>{
  state.price = e.target.value; render(); saveState();
});
document.getElementById('lotInput').addEventListener('input', e=>{
  const lot = parseFloat(e.target.value);
  if(lot > 0) state.capital = capitalFromLot(lot).toFixed(2);
  render(); saveState();
});
document.querySelectorAll('button[data-loss]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const key = 'loss' + b.dataset.dir;
    const inp = document.getElementById(key);
    if(b.dataset.loss === 'clr'){
      state[key] = ''; inp.value = '';
    } else {
      const cur = String(state[key] || '').trim();
      if(cur === '' || cur.endsWith('+')) return;
      state[key] = cur + '+'; inp.value = state[key]; inp.focus();
    }
    renderCalcs(); saveState();
  });
});
['lossBuy','lossSell'].forEach(id=>{
  document.getElementById(id).addEventListener('input', e=>{
    state[id] = e.target.value; renderCalcs(); saveState();
  });
});
document.getElementById('distInput').addEventListener('input', e=>{
  state.dist = e.target.value; render(); saveState();
});
document.querySelectorAll('#tfOpts button').forEach(b=>{
  b.addEventListener('click', ()=>{ state.tf = b.dataset.tf; state.dist = b.dataset.dist; render(); saveState(); });
});
document.querySelectorAll('#rrOpts button').forEach(b=>{
  b.addEventListener('click', ()=>{ state.rr = parseFloat(b.dataset.rr); render(); saveState(); });
});
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const key = btn.dataset.side==='buy' ? 'buyStage' : 'sellStage';
  if(btn.dataset.action==='stop')  state[key] = Math.min(BASE_STAGES, state[key]+1);
  if(btn.dataset.action==='reset') state[key] = 1;
  render(); saveState();
});
document.getElementById('tableToggle').addEventListener('click', ()=>{
  const w = document.getElementById('tableWrap');
  const showing = w.style.display !== 'none';
  w.style.display = showing ? 'none' : 'block';
  document.getElementById('tableToggle').textContent = showing ? 'Показать таблицу ▾' : 'Скрыть таблицу ▴';
});

loadState();
</script>
</body>
</html>
